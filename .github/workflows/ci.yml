name: CI

on:
  push:
    branches: [main]
  pull_request:

# One CI run per ref; a new push cancels the in-flight run for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  # ------------------------------------------------------------------------------------
  # Backend: formatting, vet, staticcheck, unit tests with the race detector.
  # ------------------------------------------------------------------------------------
  backend:
    name: backend (fmt, vet, staticcheck, test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false
          working-directory: backend
          cache-key: ${{ env.GO_VERSION }}

      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Backend"
            echo
            if [ -f coverage.out ]; then
              echo '```'
              go tool cover -func=coverage.out | tail -n 1
              echo '```'
            else
              echo "_no coverage profile produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------
  # Backend integration: real Redis, DynamoDB Local and ElasticMQ as service containers.
  # Tests are behind the `integration` build tag so unit runs stay hermetic.
  # ------------------------------------------------------------------------------------
  backend-integration:
    name: backend integration (redis, dynamodb-local, elasticmq)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
      elasticmq:
        image: softwaremill/elasticmq-native:latest
        ports: ["9324:9324"]
    env:
      STORAGE: dynamodb
      CACHE: redis
      QUEUE: sqs
      ENV: local
      REDIS_ADDR: localhost:6379
      DYNAMODB_ENDPOINT: http://localhost:8000
      DYNAMODB_TABLE: vault_rush
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SQS_ENDPOINT: http://localhost:9324
      SQS_QUEUE_URL: http://localhost:9324/000000000000/vault-rush-events
      ADMIN_TOKEN: ci-admin-token
      TOKEN_SECRET: ci-token-secret
      TELEMETRY_WORKERS: "4"
      TELEMETRY_BUFFER: "256"
      RATE_LIMIT_PER_MIN: "100000"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      # Service containers start before checkout, so the ElasticMQ config file cannot be
      # mounted. Create the queues through the SQS API instead (same as production).
      - name: Provision SQS queues (ElasticMQ)
        working-directory: .
        run: |
          for _ in $(seq 1 30); do
            if aws sqs list-queues --endpoint-url "$SQS_ENDPOINT" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          dlq_url=$(aws sqs create-queue --endpoint-url "$SQS_ENDPOINT" \
            --queue-name vault-rush-events-dlq --query QueueUrl --output text)
          dlq_arn=$(aws sqs get-queue-attributes --endpoint-url "$SQS_ENDPOINT" \
            --queue-url "$dlq_url" --attribute-names QueueArn --query Attributes.QueueArn --output text)
          aws sqs create-queue --endpoint-url "$SQS_ENDPOINT" --queue-name vault-rush-events \
            --attributes "{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$dlq_arn\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\",\"ReceiveMessageWaitTimeSeconds\":\"1\"}"
          aws sqs list-queues --endpoint-url "$SQS_ENDPOINT"

      - name: Provision DynamoDB table (DynamoDB Local)
        working-directory: .
        run: ./infrastructure/docker/dynamodb/create-table.sh

      - name: go test -tags=integration
        run: go test -race -count=1 -tags=integration -coverprofile=coverage-integration.out ./...

      - name: Summary
        if: always()
        run: |
          {
            echo "## Backend integration"
            echo
            echo "STORAGE=$STORAGE CACHE=$CACHE QUEUE=$QUEUE"
            if [ -f coverage-integration.out ]; then
              echo '```'
              go tool cover -func=coverage-integration.out | tail -n 1
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------
  # Web apps: player client and LiveOps admin (Vite). typecheck/test run when defined.
  # ------------------------------------------------------------------------------------
  web:
    # Check names surface as exactly "client" and "admin" (for branch protection rules).
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        # Vitest detects CI=true and runs once instead of watching.
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.app }}"
            echo
            if [ -d dist ]; then
              echo "dist size: $(du -sh dist | cut -f1)"
            else
              echo "_build did not produce dist/_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------
  # Docker: prove every image builds on pull requests. Nothing is pushed here — deploy.yml
  # builds and pushes from main after CI passes.
  # ------------------------------------------------------------------------------------
  docker:
    name: docker build ${{ matrix.image }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, client, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.image }}.Dockerfile
          push: false
          load: false
          tags: vault-rush-${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        if: always()
        run: |
          echo "- docker image \`${{ matrix.image }}\`: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
