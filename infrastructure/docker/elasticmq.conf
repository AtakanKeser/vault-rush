# ElasticMQ configuration for local development (SQS-compatible, in-memory).
#
# Mount into the softwaremill/elasticmq-native container:
#   volumes:
#     - ./infrastructure/docker/elasticmq.conf:/opt/elasticmq.conf:ro
#
# Queue URLs (account id is fixed to 000000000000):
#   http://elasticmq:9324/000000000000/vault-rush-events
#   http://elasticmq:9324/000000000000/vault-rush-events-dlq
#
# Redrive: after 5 failed receives (maxReceiveCount) a message moves to the DLQ,
# mirroring the production SQS redrive policy in infrastructure/terraform/modules/data.

include classpath("application.conf")

node-address {
  protocol     = http
  # "*" makes ElasticMQ echo the Host header of the incoming request in generated queue
  # URLs, so both localhost:9324 (host) and elasticmq:9324 (compose network) work.
  host         = "*"
  port         = 9324
  context-path = ""
}

rest-sqs {
  enabled       = true
  bind-port     = 9324
  bind-hostname = "0.0.0.0"
  # strict: reject requests that real SQS would reject (message size, attribute names...).
  sqs-limits    = strict
}

rest-stats {
  enabled       = true
  bind-port     = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

aws {
  region    = eu-central-1
  accountId = 000000000000
}

queues {
  vault-rush-events-dlq {
    defaultVisibilityTimeout = 30 seconds
    delay                    = 0 seconds
    receiveMessageWait       = 0 seconds
    fifo                     = false
  }

  vault-rush-events {
    defaultVisibilityTimeout = 30 seconds
    delay                    = 0 seconds
    # Long polling: ReceiveMessage blocks up to 20s when the queue is empty, the same
    # value the Terraform queue uses (receive_wait_time_seconds).
    receiveMessageWait       = 20 seconds
    fifo                     = false
    deadLettersQueue {
      name            = "vault-rush-events-dlq"
      maxReceiveCount = 5
    }
  }
}
